name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codegen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run codegen
        run: go run ./cmd/codegen

      - name: Check generated types are committed
        run: |
          if ! git diff --exit-code --stat -- generated_params.go generated_parameters.go generated_data_api.go targets.go; then
            echo "::error::Generated types are out of date. Run 'go run ./cmd/codegen' and commit the result."
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Test
        run: go test ./...

      - name: Build SDK
        run: go build ./...

      - name: Build examples
        run: |
          for dir in examples/web_scraping_api/*/; do
            [ -f "${dir}main.go" ] && go build "./${dir}"
          done
          for dir in examples/web_scraping_api/*/*/; do
            [ -f "${dir}main.go" ] && go build "./${dir}"
          done
